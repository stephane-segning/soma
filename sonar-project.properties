# SonarQube configuration for Soma (desktop focus)
sonar.projectKey=soma-desktop
sonar.projectName=Soma Desktop
sonar.sources=desktop/soma-app/src
sonar.tests=desktop/soma-app/src
sonar.test.inclusions=**/__tests__/**,**/*.spec.*ts,**/*.test.*ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/target/**
sonar.typescript.tsconfigPath=desktop/soma-app/tsconfig.json
sonar.javascript.lcov.reportPaths=desktop/soma-app/coverage/lcov.info
sonar.host.url=http://localhost:9000
