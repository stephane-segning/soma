version: 2
updates:
  - package-ecosystem: cargo
    # The workspace root manifest lives at the repo root, not /backend (which
    # has no Cargo.toml of its own) — this was silently producing zero cargo
    # update PRs.
    directory: "/"
    schedule:
      interval: weekly
      time: "08:00"
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "08:00"
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      time: "08:00"
    open-pull-requests-limit: 3