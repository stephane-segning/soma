name: Build Soma backend Docker image
description: Build/push a specific Dockerfile target for Soma backend bins with metadata, provenance and Trivy scans.

inputs:
  registry:
    description: Container registry host (e.g. ghcr.io)
    required: true
  image_name:
    description: Image name without registry (must be lowercase)
    required: true
  suffix:
    description: Optional suffix appended to the image name (e.g. -botd)
    required: false
    default: ""
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: "Dockerfile"
  target:
    description: Dockerfile target to build
    required: true
  platforms:
    description: Docker platforms list (comma-separated)
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    description: Whether to push to registry (true/false)
    required: false
    default: "false"
  trivy_config:
    description: Trivy config file path
    required: false
    default: "trivy.yaml"

outputs:
  image:
    description: Image name without digest
    value: ${{ steps.img.outputs.image }}
  digest:
    description: Image digest (if pushed)
    value: ${{ steps.img.outputs.digest }}
  ref:
    description: Canonical image ref (if pushed)
    value: ${{ steps.img.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Dockerfile scan (Trivy)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: .
        trivy-config: ${{ inputs.trivy_config }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: "1"
        hide-progress: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to the Docker registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}${{ inputs.suffix }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{branch}}
          type=schedule,pattern={{date 'YYYYMMDD-hhmmss' tz='UTC'}}
          type=sha,format=long
          type=sha,format=long,prefix={{branch}}-
          type=ref,event=tag

    - name: Build (and push)
      id: build
      uses: docker/build-push-action@v6
      with:
        pull: true
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: ${{ inputs.push == 'true' }}
        sbom: ${{ inputs.push == 'true' }}

    - name: Set canonical image ref
      id: img
      if: ${{ inputs.push == 'true' }}
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image_name }}${{ inputs.suffix }}
        DIGEST: ${{ steps.build.outputs.digest }}
        REF: ${{ inputs.registry }}/${{ inputs.image_name }}${{ inputs.suffix }}@${{ steps.build.outputs.digest }}
      shell: bash
      run: |
        {
          printf 'image=%s\n' "$IMAGE"
          printf 'digest=%s\n' "$DIGEST"
          printf 'ref=%s\n' "$REF"
        } >> "$GITHUB_OUTPUT"

    - name: Install Cosign
      if: ${{ inputs.push == 'true' }}
      uses: sigstore/cosign-installer@v3

    - name: Vulnerability scan (Trivy)
      if: ${{ inputs.push == 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.img.outputs.ref }}
        format: table
        vuln-type: os,library
        severity: CRITICAL,HIGH
        exit-code: "1"
        ignore-unfixed: true
        hide-progress: true
