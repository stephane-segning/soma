name: package-desktop
description: Build and package a Tauri desktop app (Soma or Tapia) for the runner OS/arch.

inputs:
  project_dir:
    description: Desktop workspace root
    required: false
    default: .
  app:
    description: Workspace app to build (soma-app or tapia-app)
    required: false
    default: soma-app
  arch:
    description: Target architecture for packaging (x64 or arm64). Defaults to host arch.
    required: false
    default: ""
  artifact_dir:
    description: Output directory for packaged artifacts
    required: false
    default: artifacts/desktop

outputs:
  version:
    description: App version (from package.json)
    value: ${{ steps.meta.outputs.version }}
  artifact_paths:
    description: Newline-separated list of produced artifact paths
    value: ${{ steps.collect.outputs.artifact_paths }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ runner.os == 'Linux' && (inputs.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu') || runner.os == 'macOS' && (inputs.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

    - name: Install Tauri dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          xdg-utils

    - name: Enable corepack (pnpm)
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.0.0 --activate

    - name: Setup protoc
      uses: ./.github/actions/setup-protoc

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: pnpm install --frozen-lockfile

    - id: meta
      name: Resolve app version
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        PKG="${{ inputs.app }}"
        VERSION="$(PKG="$PKG" node -p "require('./desktop/' + process.env.PKG + '/package.json').version")"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build app (Tauri)
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"
      run: |
        set -euo pipefail
        PKG="${{ inputs.app }}"
        ARCH="${{ inputs.arch }}"
        if [ -n "$ARCH" ]; then
          case "$ARCH" in
            x64|arm64|amd64) ;; # host arch should match runner
            *) echo "Unsupported arch input: $ARCH (expected x64, amd64, or arm64)" >&2; exit 1 ;;
          esac
        fi
        case "${RUNNER_OS}" in
          "macOS") BUNDLES="app" ;;
          "Linux") BUNDLES="appimage" ;;
          *) echo "Unsupported runner OS: ${RUNNER_OS}" >&2; exit 1 ;;
        esac
        pnpm --filter "$PKG" tauri build -b "$BUNDLES"

    - id: collect
      name: Collect artifacts
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.artifact_dir }}"

        BUNDLE_DIR="./target/release/bundle"
        if [ ! -d "$BUNDLE_DIR" ]; then
          echo "Expected bundle directory at $BUNDLE_DIR"
          exit 1
        fi

        ARTIFACT_DIR_ABS="$GITHUB_WORKSPACE/${{ inputs.artifact_dir }}"
        mkdir -p "$ARTIFACT_DIR_ABS"

        OUTS_FILE="$RUNNER_TEMP/desktop-artifacts.txt"
        : > "$OUTS_FILE"

        OUTS_FILE="$RUNNER_TEMP/desktop-artifacts.txt"
        : > "$OUTS_FILE"
        # Bundle macOS .app directories into tar.gz for upload; copy AppImage as-is.
        while IFS= read -r appdir; do
          [ -n "$appdir" ] || continue
          name="$(basename "$appdir")"
          out="$ARTIFACT_DIR_ABS/${name}.tar.gz"
          tar -czf "$out" -C "$(dirname "$appdir")" "$name"
          printf '%s\n' "$out" >> "$OUTS_FILE"
        done < <(find "$BUNDLE_DIR" -maxdepth 3 -type d -name '*.app' -print)

        while IFS= read -r f; do
          [ -n "$f" ] || continue
          base="$(basename "$f")"
          out="$ARTIFACT_DIR_ABS/${base}"
          cp "$f" "$out"
          printf '%s\n' "$out" >> "$OUTS_FILE"
        done < <(find "$BUNDLE_DIR" -maxdepth 3 -type f -name '*.AppImage' -print)

        if [ ! -s "$OUTS_FILE" ]; then
          echo "No artifacts found in $BUNDLE_DIR"
          find "$BUNDLE_DIR" -maxdepth 3 -type f -print
          exit 1
        fi

        {
          echo "artifact_paths<<EOF"
          cat "$OUTS_FILE"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
