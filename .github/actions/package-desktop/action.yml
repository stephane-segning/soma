name: package-desktop
description: Build and package the Soma desktop Electron app for the runner OS/arch.

inputs:
  project_dir:
    description: Desktop workspace root
    required: false
    default: desktop
  app:
    description: Workspace app to build (soma or tapia)
    required: false
    default: soma
  artifact_dir:
    description: Output directory for packaged artifacts
    required: false
    default: artifacts/desktop

outputs:
  version:
    description: App version (from package.json)
    value: ${{ steps.meta.outputs.version }}
  artifact_paths:
    description: Newline-separated list of produced artifact paths
    value: ${{ steps.collect.outputs.artifact_paths }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Enable corepack (pnpm)
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.0.0 --activate

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: pnpm install --frozen-lockfile

    - id: meta
      name: Resolve app version
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        VERSION="$(node -p "require('./${{ inputs.app }}/package.json').version")"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build app
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"
      run: |
        set -euo pipefail
        PKG="@soma/${{ inputs.app }}"

        # Build renderer/main first.
        pnpm --filter "$PKG" run build

        # Produce OS-native artifacts (include dmg/deb/zip).
        if [ "${RUNNER_OS}" = "Linux" ]; then
          pnpm --filter "$PKG" exec electron-builder --linux deb rpm zip
        elif [ "${RUNNER_OS}" = "macOS" ]; then
          pnpm --filter "$PKG" exec electron-builder --mac dmg pkg zip
        else
          echo "Unsupported runner OS: ${RUNNER_OS}"
          exit 1
        fi

    - id: collect
      name: Collect artifacts
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.artifact_dir }}"

        DIST="./${{ inputs.app }}/dist"
        if [ ! -d "$DIST" ]; then
          echo "Expected dist directory at $DIST"
          exit 1
        fi

        # electron-builder emits different extensions depending on target.
        FILES="$(find "$DIST" -maxdepth 1 -type f \\( \
          -name '*.dmg' -o -name '*.pkg' -o \
          -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
          -name '*.zip' \
        \\) -print | sort || true)"
        if [ -z "$FILES" ]; then
          echo "No artifacts found in $DIST"
          find "$DIST" -maxdepth 1 -type f -print
          exit 1
        fi

        OUTS_FILE="$RUNNER_TEMP/desktop-artifacts.txt"
        : > "$OUTS_FILE"
        printf '%s\n' "$FILES" | while IFS= read -r f; do
          [ -n "$f" ] || continue
          base="$(basename "$f")"
          out="${{ inputs.artifact_dir }}/${base}"
          cp "$f" "$out"
          printf '%s\n' "$out" >> "$OUTS_FILE"
        done

        {
          echo "artifact_paths<<EOF"
          cat "$OUTS_FILE"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
