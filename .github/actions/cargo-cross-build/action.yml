name: cargo-cross-build
description: Build a Rust package for a specific target using houseabsolute/actions-rust-cross (and ensure protoc is available).

inputs:
  working_directory:
    description: Working directory to run cargo/cross in
    required: false
    default: backend
  target:
    description: Rust target triple
    required: true
  args:
    description: Arguments passed to cargo/cross (e.g. --locked --profile prod -p soma-daemon)
    required: true
  toolchain:
    description: Rust toolchain channel (stable/beta/nightly)
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Install protoc (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends protobuf-compiler

    - name: Install protoc (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew update
        brew install protobuf

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working_directory }} -> target

    - name: Cargo build (${{ inputs.target }})
      uses: houseabsolute/actions-rust-cross@v0
      with:
        command: build
        target: ${{ inputs.target }}
        toolchain: ${{ inputs.toolchain }}
        working-directory: ${{ inputs.working_directory }}
        args: ${{ inputs.args }}

