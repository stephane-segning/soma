name: cargo-cross-build
description: Build a Rust package for a specific target using houseabsolute/actions-rust-cross (and ensure protoc is available).

inputs:
  working_directory:
    description: Working directory to run cargo/cross in
    required: false
    default: backend
  target:
    description: Rust target triple
    required: true
  args:
    description: Arguments passed to cargo/cross (e.g. --locked --profile prod -p soma-daemon)
    required: true
  toolchain:
    description: Rust toolchain channel (stable/beta/nightly)
    required: false
    default: stable
  use_cross:
    description: Use cross (true/false). Set to false for native cargo builds.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install protoc (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends protobuf-compiler

    - name: Install protoc (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew update
        brew install protobuf

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working_directory }} -> target

    - name: Install target toolchain (native)
      if: ${{ inputs.use_cross != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        rustup target add "${{ inputs.target }}"
        if [[ "${{ inputs.target }}" == aarch64-unknown-linux-gnu* ]]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
        fi

    - name: Cargo build (native)
      if: ${{ inputs.use_cross != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        cargo build --target "${{ inputs.target }}" ${{ inputs.args }}

    - name: Cargo build (cross)
      if: ${{ inputs.use_cross == 'true' }}
      uses: houseabsolute/actions-rust-cross@v0
      with:
        command: build
        target: ${{ inputs.target }}
        toolchain: ${{ inputs.toolchain }}
        working-directory: ${{ inputs.working_directory }}
        args: ${{ inputs.args }}
