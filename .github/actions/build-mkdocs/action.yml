name: build-mkdocs
description: Build MkDocs site
runs:
  using: "composite"
  steps:
    - name: Setup just
      uses: extractions/setup-just@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install MkDocs
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material mkdocs-bootstrap386
    - name: Build MkDocs
      shell: bash
      run: just build-docs
