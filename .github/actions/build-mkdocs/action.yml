name: build-mkdocs
description: Build MkDocs site
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install MkDocs
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
    - name: Build MkDocs
      shell: bash
      run: |
        mkdocs build --config-file docs/mkdocs.yml --site-dir site
