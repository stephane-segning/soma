name: build-docs
description: Build docs site (VitePress + Storybook)
runs:
  using: "composite"
  steps:
    - name: Setup just
      uses: extractions/setup-just@v3
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml
    - name: Enable corepack (pnpm)
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.0.0 --activate
    - name: Install docs dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build docs
      shell: bash
      run: just build-docs
