name: build-release-bundle
description: Build OS/arch-specific Soma bundle packages by downloading published assets.

inputs:
  bundle_version:
    description: Bundle version label (defaults to timestamp)
    required: false
    default: ""
  daemons_version:
    description: Daemons release version (without leading v, e.g. 0.1.0). If empty, resolves latest daemons-v*.
    required: false
    default: ""
  desktop_version:
    description: Desktop release version (without leading v, e.g. 1.0.0). If empty, resolves latest desktop-v*.
    required: false
    default: ""
  daemons_repo:
    description: Optional repo override for daemon release discovery
    required: false
    default: ""
  desktop_repo:
    description: Optional repo override for desktop release discovery
    required: false
    default: ""
  daemons_manifest:
    description: Optional daemon release manifest path or URL
    required: false
    default: ""
  desktop_manifest:
    description: Optional desktop release manifest path or URL
    required: false
    default: ""
  docker_images:
    description: Optional docker image refs (newline-separated) to include in README
    required: false
    default: ""
  out_dir:
    description: Output directory for the bundle build
    required: false
    default: artifacts/bundle
  bundle_os:
    description: linux or macos
    required: true
  bundle_arch:
    description: amd64 or arm64
    required: true

outputs:
  platform_out:
    description: Platform output directory
    value: ${{ steps.run.outputs.platform_out }}
  staging_dir:
    description: Directory scanned for SBOM
    value: ${{ steps.run.outputs.staging_dir }}
  produced:
    description: Newline-separated list of produced files
    value: ${{ steps.run.outputs.produced }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Enable corepack (pnpm)
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.0.0 --activate

    - name: Install pnpm dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install packaging deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential ruby ruby-dev rpm
        sudo gem install --no-document fpm

    - id: run
      name: Build bundle
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BUNDLE_VERSION: ${{ inputs.bundle_version }}
        DAEMONS_VERSION: ${{ inputs.daemons_version }}
        DESKTOP_VERSION: ${{ inputs.desktop_version }}
        DAEMONS_REPO: ${{ inputs.daemons_repo }}
        DESKTOP_REPO: ${{ inputs.desktop_repo }}
        DAEMONS_MANIFEST: ${{ inputs.daemons_manifest }}
        DESKTOP_MANIFEST: ${{ inputs.desktop_manifest }}
        DOCKER_IMAGES: ${{ inputs.docker_images }}
        OUT_DIR: ${{ inputs.out_dir }}
        BUNDLE_OS: ${{ inputs.bundle_os }}
        BUNDLE_ARCH: ${{ inputs.bundle_arch }}
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "jq is required to parse JSON output (not found on PATH)" >&2
          exit 1
        fi
        JSON_PATH="$RUNNER_TEMP/release_bundle.json"
        pnpm --filter @soma/packaging run bundle:release -- \
          --os "$BUNDLE_OS" \
          --arch "$BUNDLE_ARCH" \
          --out-dir "$OUT_DIR" \
          --repo "${GITHUB_REPOSITORY}" \
          ${DAEMONS_VERSION:+--daemons-version "$DAEMONS_VERSION"} \
          ${DESKTOP_VERSION:+--desktop-version "$DESKTOP_VERSION"} \
          ${DAEMONS_REPO:+--daemons-repo "$DAEMONS_REPO"} \
          ${DESKTOP_REPO:+--desktop-repo "$DESKTOP_REPO"} \
          ${DAEMONS_MANIFEST:+--daemons-manifest "$DAEMONS_MANIFEST"} \
          ${DESKTOP_MANIFEST:+--desktop-manifest "$DESKTOP_MANIFEST"} \
          ${BUNDLE_VERSION:+--bundle-version "$BUNDLE_VERSION"} \
          ${DOCKER_IMAGES:+--docker-images "$DOCKER_IMAGES"} \
          | tee "$JSON_PATH"
        JSON_LINE="$(awk 'NF{line=$0} END{print line}' "$JSON_PATH")"
        if [ -z "$JSON_LINE" ]; then
          echo "Failed to locate packaging JSON output in $JSON_PATH" >&2
          exit 1
        fi
        if ! echo "$JSON_LINE" | jq -e . >/dev/null 2>&1; then
          echo "Last non-empty line is not valid JSON:" >&2
          echo "$JSON_LINE" >&2
          exit 1
        fi
        echo "$JSON_LINE" > "$JSON_PATH"
        PLATFORM_OUT="$(jq -r '.platform_out' "$JSON_PATH")"
        STAGING_DIR="$(jq -r '.staging_dir' "$JSON_PATH")"
        {
          echo "platform_out=${PLATFORM_OUT}"
          echo "staging_dir=${STAGING_DIR}"
          echo "produced<<EOF"
          jq -r '.produced[]' "$JSON_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
