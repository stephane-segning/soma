name: TEMP verify tauri-action v0 vs v1

# TEMPORARY — delete before merging. Exists only to prove that bumping
# tauri-apps/tauri-action from v0 to v1 (dependabot #155) does not break
# the desktop release build. Mirrors release-desktop.yml's `build` job
# step-for-step, minus release creation/upload, so the only variable
# between the two linux jobs is the action major version.

on:
  push:
    branches: [claude/tauri-action-v1]

jobs:
  linux-v0:
    name: linux/amd64 @v0 (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: ./.github/actions/setup-protoc
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev file patchelf build-essential pkg-config \
            xdg-utils desktop-file-utils
      - shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/desktop-app
          tauriScript: pnpm tauri
          args: --target x86_64-unknown-linux-gnu
      - name: Prove bundles are where collect expects
        shell: bash
        run: |
          set -euo pipefail
          bash .github/verify-bundle-layout.sh x86_64-unknown-linux-gnu AppImage deb

  linux-v1:
    name: linux/amd64 @v1 (candidate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: ./.github/actions/setup-protoc
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev file patchelf build-essential pkg-config \
            xdg-utils desktop-file-utils
      - shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/desktop-app
          tauriScript: pnpm tauri
          args: --target x86_64-unknown-linux-gnu
      - name: Prove bundles are where collect expects
        shell: bash
        run: |
          set -euo pipefail
          bash .github/verify-bundle-layout.sh x86_64-unknown-linux-gnu AppImage deb

  macos-v1:
    name: macos/arm64 @v1 (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: ./.github/actions/setup-protoc
      - shell: bash
        run: pnpm install --frozen-lockfile
      # Deliberately NO Apple secrets: this proves the bundle layout the
      # collect step depends on, not the signing/notarization path.
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/desktop-app
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin
      - name: Prove bundles are where collect expects
        shell: bash
        run: |
          set -euo pipefail
          bash .github/verify-bundle-layout.sh aarch64-apple-darwin dmg app
