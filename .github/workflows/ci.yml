name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-daemon:
    name: Build soma-daemon (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: amd64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu
            arch: arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: amd64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build soma-daemon
        uses: ./.github/actions/cargo-cross-build
        with:
          working_directory: backend
          target: ${{ matrix.target }}
          args: --locked --profile prod -p soma-daemon

  build-backend:
    name: Build backend workspace (gated)
    runs-on: ubuntu-latest
    needs: build-daemon
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build backend workspace
        run: |
          cd backend
          cargo build --workspace --locked
