name: Release bundle

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Bundle version label (defaults to timestamp)
        required: false
        type: string
      tag:
        description: Git tag for the GitHub Release (defaults to bundle-<bundle_version>)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as prerelease
        required: false
        type: boolean
        default: false
      daemons_version:
        description: Daemons release version (without leading v). If empty, resolves latest daemons-v* via API.
        required: false
        type: string
      desktop_version:
        description: Desktop release version (without leading v). If empty, resolves latest desktop-v* via API.
        required: false
        type: string
      docker_images:
        description: Docker image refs to include in README (newline-separated)
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bundle_version: ${{ steps.meta.outputs.bundle_version }}
      tag: ${{ steps.meta.outputs.tag }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Resolve bundle version + tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.bundle_version }}" ]; then
            BV="${{ inputs.bundle_version }}"
          else
            BV="$(date -u +%Y%m%d-%H%M%S)"
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="bundle-${BV}"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            ML=true
          else
            ML=false
          fi
          {
            echo "bundle_version=${BV}"
            echo "tag=${TAG}"
            echo "make_latest=${ML}"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Bundle ${{ steps.meta.outputs.bundle_version }}
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          makeLatest: ${{ steps.meta.outputs.make_latest }}
          draft: false
          body: |
            Soma bundle packages (daemon + agentd + pointers to desktop + docker images).

            Use `install.sh` from the matching OS/arch package directory, or see the GitHub Pages docs.

  build:
    name: Build + publish (${{ matrix.os }} / ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs_on: ubuntu-latest
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: macos
            arch: amd64
            runs_on: macos-15-intel
          - os: macos
            arch: arm64
            runs_on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build bundle package
        id: bundle
        uses: ./.github/actions/build-release-bundle
        with:
          bundle_version: ${{ needs.prepare.outputs.bundle_version }}
          daemons_version: ${{ inputs.daemons_version }}
          desktop_version: ${{ inputs.desktop_version }}
          docker_images: ${{ inputs.docker_images }}
          out_dir: artifacts/bundle
          bundle_os: ${{ matrix.os }}
          bundle_arch: ${{ matrix.arch }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: ${{ steps.bundle.outputs.staging_dir }}
          format: spdx-json
          output-file: ${{ steps.bundle.outputs.platform_out }}/sbom-bundle-${{ needs.prepare.outputs.bundle_version }}-${{ matrix.os }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            ${{ steps.bundle.outputs.produced }}
            ${{ steps.bundle.outputs.platform_out }}/sbom-bundle-${{ needs.prepare.outputs.bundle_version }}-${{ matrix.os }}-${{ matrix.arch }}.spdx.json
