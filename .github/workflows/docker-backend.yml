name: Build backend Docker images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        type: boolean
        default: true
      platforms:
        description: Docker platforms (comma-separated)
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Will be lowercased in-job for GHCR compatibility.
  IMAGE_NAME: ${{ github.repository_owner }}/soma-backend

jobs:
  build-test:
    name: Build soma-daemon (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: amd64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu
            arch: arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: amd64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build soma-daemon
        uses: ./.github/actions/cargo-cross-build
        with:
          working_directory: backend
          target: ${{ matrix.target }}
          args: --locked

  build:
    name: Docker build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - build-test
    strategy:
      fail-fast: false
      matrix:
        name:
          - botd
          - relayd
          - rendezvousd
          - bffd
          - serverd
        include:
          - name: botd
            suffix: "-botd"
            docker_target: "botd"
          - name: relayd
            suffix: "-relayd"
            docker_target: "relayd"
          - name: rendezvousd
            suffix: "-rendezvousd"
            docker_target: "rendezvousd"
          - name: bffd
            suffix: "-bffd"
            docker_target: "bffd"
          - name: serverd
            suffix: "-serverd"
            docker_target: "serverd"

    permissions:
      packages: write
      contents: read
      id-token: write # Required for signed provenance when pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: lowercase
        name: Lowercase image name
        uses: AsZc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Build (and optionally push) ${{ matrix.name }}
        id: docker
        uses: ./.github/actions/docker-build-backend
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ steps.lowercase.outputs.lowercase }}
          suffix: ${{ matrix.suffix }}
          target: ${{ matrix.docker_target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}

      - name: Generate SBOM (Syft) for image
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.docker.outputs.ref }}
          format: spdx-json
          output-file: sbom-image-${{ matrix.name }}.spdx.json
          artifact-name: sbom-image-${{ matrix.name }}.spdx.json
          upload-release-assets: false
