name: Build backend Docker images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        type: boolean
        default: true
      platforms:
        description: Docker platforms (comma-separated)
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Will be lowercased in-job for GHCR compatibility.
  IMAGE_NAME: ${{ github.repository_owner }}/soma-backend

jobs:
  build-binaries:
    name: Build backend bins (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools build-essential pkg-config perl protobuf-compiler libprotobuf-dev
          rustup target add ${{ matrix.target }}

      - name: Build backend binaries (musl)
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          export PROTOC=/usr/bin/protoc
          export PROTOC_INCLUDE=/usr/include
          export ${{ matrix.linker_env }}=musl-gcc
          cargo build --profile prod --locked --target "${{ matrix.target }}" \
            -p soma-botd \
            -p soma-relayd \
            -p soma-rendezvousd \
            -p soma-bffd \
            -p soma-serverd

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/backend/linux-${{ matrix.arch }}"
          mkdir -p "$OUT"
          cp backend/target/${{ matrix.target }}/prod/soma-botd "$OUT/"
          cp backend/target/${{ matrix.target }}/prod/soma-relayd "$OUT/"
          cp backend/target/${{ matrix.target }}/prod/soma-rendezvousd "$OUT/"
          cp backend/target/${{ matrix.target }}/prod/soma-bffd "$OUT/"
          cp backend/target/${{ matrix.target }}/prod/soma-serverd "$OUT/"
          (cd "$OUT" && shasum -a 256 soma-* > SHA256SUMS.txt 2>/dev/null || sha256sum soma-* > SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-bins-${{ matrix.arch }}
          path: dist/backend/linux-${{ matrix.arch }}
          if-no-files-found: error

  build:
    name: Docker build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        name:
          - botd
          - relayd
          - rendezvousd
          - bffd
          - serverd
        include:
          - name: botd
            suffix: "-botd"
            docker_target: "botd"
          - name: relayd
            suffix: "-relayd"
            docker_target: "relayd"
          - name: rendezvousd
            suffix: "-rendezvousd"
            docker_target: "rendezvousd"
          - name: bffd
            suffix: "-bffd"
            docker_target: "bffd"
          - name: serverd
            suffix: "-serverd"
            docker_target: "serverd"

    permissions:
      packages: write
      contents: read
      id-token: write # Required for signed provenance when pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-bins-amd64
          path: dist/backend/linux-amd64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-bins-arm64
          path: dist/backend/linux-arm64

      - name: Ensure executables
        shell: bash
        run: |
          chmod +x dist/backend/linux-amd64/soma-* dist/backend/linux-arm64/soma-*

      - id: lowercase
        name: Lowercase image name
        uses: AsZc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Build (and optionally push) ${{ matrix.name }}
        id: docker
        uses: ./.github/actions/docker-build-backend
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ steps.lowercase.outputs.lowercase }}
          suffix: ${{ matrix.suffix }}
          target: ${{ matrix.docker_target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}

      - name: Generate SBOM (Syft) for image
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.docker.outputs.ref }}
          format: spdx-json
          output-file: sbom-image-${{ matrix.name }}.spdx.json
          artifact-name: sbom-image-${{ matrix.name }}.spdx.json
          upload-release-assets: false
