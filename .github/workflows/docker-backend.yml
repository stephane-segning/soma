name: Build somad Docker image

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR
        required: false
        type: boolean
        default: true
      platforms:
        description: Docker platforms (comma-separated)
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Will be lowercased in-job for GHCR compatibility.
  IMAGE_NAME: ${{ github.repository_owner }}/somad

jobs:
  build-binary:
    name: Build somad (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools build-essential pkg-config perl
          rustup target add ${{ matrix.target }}

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      - name: Build somad (musl)
        shell: bash
        run: |
          set -euo pipefail
          export ${{ matrix.linker_env }}=musl-gcc
          cargo build --release --locked --target "${{ matrix.target }}" -p somad

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/backend/linux-${{ matrix.arch }}"
          mkdir -p "$OUT"
          cp target/${{ matrix.target }}/release/somad "$OUT/"
          (cd "$OUT" && shasum -a 256 somad > SHA256SUMS.txt 2>/dev/null || sha256sum somad > SHA256SUMS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: somad-${{ matrix.arch }}
          path: dist/backend/linux-${{ matrix.arch }}
          if-no-files-found: error

  build:
    name: Docker build for somad
    runs-on: ubuntu-latest
    needs:
      - build-binary

    permissions:
      packages: write
      contents: read
      id-token: write # Required for signed provenance when pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Download amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: somad-amd64
          path: dist/backend/linux-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: somad-arm64
          path: dist/backend/linux-arm64

      - name: Ensure executables
        shell: bash
        run: |
          chmod +x dist/backend/linux-amd64/somad dist/backend/linux-arm64/somad

      - id: lowercase
        name: Lowercase image name
        uses: AsZc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Build (and optionally push) somad
        id: docker
        uses: ./.github/actions/docker-build-backend
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ steps.lowercase.outputs.lowercase }}
          suffix: ""
          target: ""
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}

      - name: Generate SBOM (Syft) for image
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.docker.outputs.ref }}
          format: spdx-json
          output-file: sbom-image-somad.spdx.json
          artifact-name: sbom-image-somad.spdx.json
          upload-release-assets: false
