name: Release desktop (Electron)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (defaults to desktop package.json version)
        required: false
        type: string
      tag:
        description: Git tag for the GitHub Release (defaults to desktop-v<version>)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as prerelease
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Resolve version + tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./desktop/soma/package.json').version")"
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="desktop-v${VERSION}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release (never latest)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Desktop ${{ steps.meta.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          makeLatest: false
          draft: false
          body: |
            Soma desktop builds for Linux and macOS.

            Assets are suffixed with OS/arch.

  build:
    name: Build + publish (${{ matrix.os }} / ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs_on: ubuntu-latest
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runs_on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # The @soma/node napi-rs addon is built by `pnpm --filter @soma/node run
      # build` during the desktop build, so cargo + rustc must be available.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Electron apps (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          ARCH_FLAG="--x64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_FLAG="--arm64"
          fi
          pnpm --filter soma run build:mac -- "$ARCH_FLAG"

      - name: Ad-hoc sign + rezip macOS apps
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          sign_and_zip() {
            local app_name="$1"
            local dist_dir="$2"
            local app_path
            app_path="$(find "$dist_dir" -maxdepth 2 -name "${app_name}.app" -print -quit)"
            if [ -z "$app_path" ]; then
              echo "Missing ${app_name}.app in ${dist_dir}" >&2
              exit 1
            fi
            codesign --force --deep --sign - "$app_path"
            local zip_path
            zip_path="$(find "$dist_dir" -maxdepth 1 -name "${app_name}*.zip" ! -name "*.blockmap" -print -quit)"
            if [ -z "$zip_path" ]; then
              zip_path="${dist_dir}/${app_name}.zip"
            else
              rm -f "$zip_path"
            fi
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"
          }
          sign_and_zip "soma" "desktop/soma/dist"

      - name: Build Electron apps (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAG="--x64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_FLAG="--arm64"
          fi
          pnpm --filter soma run build:linux -- "$ARCH_FLAG"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"

          if [ "${{ matrix.os }}" = "linux" ]; then
            EXT="AppImage"
            SOMA_FILE="$(find desktop/soma/dist -maxdepth 1 -name '*.AppImage' -print | head -n 1)"
          else
            EXT="zip"
            SOMA_FILE="$(find desktop/soma/dist -maxdepth 1 -name '*.zip' -print | head -n 1)"
          fi

          if [ -z "$SOMA_FILE" ]; then
            echo "Missing artifacts. soma=$SOMA_FILE" >&2
            exit 1
          fi

          SOMA_OUT="$OUT_DIR/soma-desktop-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.${EXT}"
          cp "$SOMA_FILE" "$SOMA_OUT"

      - name: Add per-platform SHA256SUMS and install scripts to release dir
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          PARTIAL="SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt"

          # Copy the reviewed-in-repo install/uninstall scripts so the
          # release ships them as `install.sh` / `uninstall.sh` assets. The
          # contents are identical across matrix legs, so the upload-overwrite
          # at the release level is intentional/harmless.
          cp docs/src/public/release-install.sh   "$OUT_DIR/install.sh"
          cp docs/src/public/release-uninstall.sh "$OUT_DIR/uninstall.sh"
          chmod +x "$OUT_DIR/install.sh" "$OUT_DIR/uninstall.sh"

          # Compute the per-platform partial SHA256SUMS. publish-manifest job
          # downloads every partial and concatenates them into the consumer-
          # facing `SHA256SUMS.txt`, so this asset name has to be unique per
          # matrix leg (otherwise softprops/action-gh-release would overwrite
          # previous legs' manifests).
          sha_one() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          (
            cd "$OUT_DIR"
            : > "$PARTIAL.tmp"
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in
                SHA256SUMS*.txt|*.tmp) continue ;;
              esac
              sha_one "$f" >> "$PARTIAL.tmp"
            done
            sort -k2 "$PARTIAL.tmp" > "$PARTIAL"
            rm -f "$PARTIAL.tmp"
          )

          echo "Release dir contents:"
          ls -la "$OUT_DIR"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/soma-desktop-${{ needs.prepare.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.*
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/install.sh
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/uninstall.sh

  publish-manifest:
    name: Publish release manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate desktop release manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          python3 <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          extension_by_os = {"linux": "AppImage", "macos": "zip"}
          artifacts = []
          arch_by_os = {"linux": ("amd64", "arm64"), "macos": ("arm64",)}
          for os_name, ext in extension_by_os.items():
              for arch in arch_by_os[os_name]:
                  for app in ("soma",):
                      name = f"{app}-desktop-{version}-{os_name}-{arch}.{ext}"
                      artifacts.append(
                          {
                              "name": name,
                              "app": app,
                              "os": os_name,
                              "arch": arch,
                              "url": f"{base}/{name}",
                          }
                      )
          manifest = {
              "schema_version": "soma.release-manifest.v1",
              "release_type": "desktop",
              "version": version,
              "tag": tag,
              "repo": repo,
              "artifacts": artifacts,
          }
          with open("artifacts/desktop/manifest/desktop-release-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

      - name: Aggregate per-platform SHA256SUMS into a single manifest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          cd artifacts/desktop/manifest

          # Pull every per-platform SHA256SUMS-*.txt that the matrix legs
          # uploaded to this tag; each matrix leg's filename is disjoint
          # (suffixed by os-arch), so all of them coexist on the release.
          # Concatenate + sort to produce one consumer-facing SHA256SUMS.txt
          # that lists every artifact on the tag.
          gh release download "$TAG" --pattern 'SHA256SUMS-*.txt' --dir .
          : > SHA256SUMS.txt.tmp
          for f in SHA256SUMS-*.txt; do
            [ -f "$f" ] || continue
            cat "$f" >> SHA256SUMS.txt.tmp
          done
          sort -u -k2 SHA256SUMS.txt.tmp > SHA256SUMS.txt
          rm -f SHA256SUMS.txt.tmp
          echo "Aggregated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload manifest + aggregated SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/manifest/desktop-release-manifest.json
            artifacts/desktop/manifest/SHA256SUMS.txt
