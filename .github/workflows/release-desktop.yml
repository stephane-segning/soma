name: Release desktop (Tauri)

# Manual-trigger release pipeline for the Tauri V2 desktop app
# (desktop/desktop-app). Builds via tauri-apps/tauri-action with macOS
# Developer ID signing + notarization wired through the existing Apple
# secrets, then renames each bundle to the versionless
# `soma-desktop-<os>-<arch>.<ext>` convention the docs landing page links to
# and uploads them to a `desktop-v<version>` GitHub Release (pinned as the
# repo's `latest`).
#
# NOTE: the macOS signing/notarization path cannot be exercised in CI without
# a `workflow_dispatch` run on a real macOS runner with the Apple secrets
# present. The non-mac matrix legs and the YAML shape are the parts that have
# been validated locally; treat the first real dispatch as the smoke test.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (defaults to desktop-app package.json version)
        required: false
        type: string
      tag:
        description: Git tag for the GitHub Release (defaults to desktop-v<version>)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as prerelease
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Resolve version + tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./desktop/desktop-app/package.json').version")"
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="desktop-v${VERSION}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Desktop ${{ steps.meta.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          # Marked as the repo's "latest" release so the magic
          # `https://github.com/<owner>/<repo>/releases/latest/download/<name>`
          # URLs used by the docs landing page resolve to this release.
          # Asset filenames are versionless on purpose (version is in the
          # tag) so the same URLs keep working across versions.
          makeLatest: true
          draft: false
          body: |
            Soma desktop builds for Linux and macOS.

            Assets are named `soma-desktop-<os>-<arch>.<ext>`; the version is in the release tag.

  targets:
    name: Load build matrix
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.load.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: load
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP="$(jq -c '.desktop' .github/targets.json)"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"

  build:
    name: Build + publish (${{ matrix.os }} / ${{ matrix.arch }})
    needs: [prepare, targets]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      # Tauri's Linux bundler needs GTK/WebKit + AppImage tooling. Mirrors the
      # dependency list from the Tauri V2 "Building" guide. Runner is
      # ubuntu-latest/24.04 (not 22.04) so the apt `protoc` is new enough for
      # the proto3-optional fields in our .proto files — matching the
      # server-release runners. Trade-off: AppImages built here inherit 24.04's
      # glibc floor; revisit with a pinned-protoc-on-22.04 build if wider
      # distro portability becomes a requirement.
      - name: Install Linux build deps
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            file \
            patchelf \
            build-essential \
            pkg-config

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # Tauri v2 notarization (App Store Connect API key auth) reads THREE env
      # vars: `APPLE_API_ISSUER` (issuer UUID), `APPLE_API_KEY` (the 10-char
      # key *ID*), and `APPLE_API_KEY_PATH` (filesystem path to the AuthKey
      # .p8). The `APPLE_API_KEY` secret stores the raw .p8 body so it
      # round-trips through Actions; we write it to a tempfile and export its
      # PATH as `APPLE_API_KEY_PATH`. (Earlier this exported the path as
      # `APPLE_API_KEY`, which Tauri treats as the key ID — it then looked for
      # a bogus `AuthKey_<path>.p8`, logged "skipping app notarization, could
      # not find API key file", and shipped a signed-but-unnotarized app that
      # tripped Gatekeeper's "could not verify" prompt.)
      - name: Materialize Apple API key
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Build (and sign/notarize on macOS) the Tauri bundle. We do NOT let
      # tauri-action create/own the release (it would upload assets under
      # Tauri's own versioned names); a later step renames the bundles to the
      # versionless convention the docs landing page links to and uploads them
      # to the release created by the `prepare` job.
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # macOS Developer ID signing + App Store Connect API notarization.
          # These env vars are read by Tauri's bundler; they are unset (and
          # ignored) on the Linux legs.
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization (API-key auth): KEY = the key ID, KEY_PATH = the .p8
          # file materialized above, ISSUER = the issuer UUID.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop/desktop-app
          # Do not create a release here — `prepare` owns it and the collect
          # step uploads the renamed assets.
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }}

      - name: Collect + rename bundles
        id: collect
        shell: bash
        env:
          EXTS_JSON: ${{ toJSON(matrix.artifact_exts) }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"

          # tauri build writes bundles under
          # `<target>/<triple>/release/bundle/<kind>/...`. Search broadly so we
          # are resilient to whether the workspace target dir is at the repo
          # root or under desktop/desktop-app/src-tauri.
          BUNDLE_ROOTS=(
            "$GITHUB_WORKSPACE/target/${RUST_TARGET}/release/bundle"
            "$GITHUB_WORKSPACE/desktop/desktop-app/src-tauri/target/${RUST_TARGET}/release/bundle"
          )

          find_one() {
            # $1 = filename glob
            local pat="$1" hit=""
            for root in "${BUNDLE_ROOTS[@]}"; do
              [ -d "$root" ] || continue
              hit="$(find "$root" -type f -name "$pat" ! -name '*.sig' -print 2>/dev/null | head -n 1)"
              [ -n "$hit" ] && { printf '%s' "$hit"; return 0; }
            done
            return 1
          }

          find_app() {
            local hit=""
            for root in "${BUNDLE_ROOTS[@]}"; do
              [ -d "$root" ] || continue
              hit="$(find "$root/macos" -maxdepth 1 -type d -name '*.app' -print 2>/dev/null | head -n 1)"
              [ -n "$hit" ] && { printf '%s' "$hit"; return 0; }
            done
            return 1
          }

          while IFS= read -r ext; do
            [ -n "$ext" ] || continue
            DEST="$OUT_DIR/soma-desktop-${{ matrix.os }}-${{ matrix.arch }}.${ext}"
            if [ "$ext" = "zip" ] && [ "${{ matrix.os }}" = "macos" ]; then
              # The docs link a macOS `.zip`; Tauri emits a `.app` bundle, so
              # we zip the signed/notarized `.app` ourselves (ditto preserves
              # macOS metadata + the notarization ticket stapled onto the app).
              APP="$(find_app)" || { echo "Missing *.app bundle for macOS zip" >&2; exit 1; }
              ( cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP")" "$DEST" )
              echo "Collected ${APP} -> ${DEST}"
            else
              SRC="$(find_one "*.${ext}")" || { echo "Missing *.${ext} bundle (matrix: ${{ matrix.os }}/${{ matrix.arch }})" >&2; exit 1; }
              cp "$SRC" "$DEST"
              echo "Collected ${SRC} -> ${DEST}"
            fi
          done < <(printf '%s' "$EXTS_JSON" | jq -r '.[]')

      - name: Compute per-platform SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          PARTIAL="SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt"

          # Per-leg partial manifest. The publish-manifest job downloads every
          # partial and concatenates them into the consumer-facing
          # SHA256SUMS.txt, so this asset name has to be unique per matrix leg.
          sha_one() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          (
            # Run inside OUT_DIR so sha_one records bare filenames (no path
            # prefix) — keeps the consumer-facing SHA256SUMS.txt clean.
            cd "$OUT_DIR"
            : > "$PARTIAL.tmp"
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in
                SHA256SUMS*.txt|*.tmp) continue ;;
              esac
              sha_one "$f" >> "$PARTIAL.tmp"
            done
            sort -k2 "$PARTIAL.tmp" > "$PARTIAL"
            rm -f "$PARTIAL.tmp"
          )
          echo "Release dir contents:"
          ls -la "$OUT_DIR"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/soma-desktop-${{ matrix.os }}-${{ matrix.arch }}.*
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

  publish-manifest:
    name: Publish release manifest
    needs: [prepare, targets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate desktop release manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          TARGETS_JSON: ${{ needs.targets.outputs.desktop }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          python3 <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          tagged_base = f"https://github.com/{repo}/releases/download/{tag}"
          latest_base = f"https://github.com/{repo}/releases/latest/download"
          # The matrix (os/arch/ext per entry) is the single source of truth
          # — propagated from .github/targets.json by the `targets` job.
          targets = json.loads(os.environ["TARGETS_JSON"])
          artifacts = []
          for entry in targets:
              os_name = entry["os"]
              arch = entry["arch"]
              for ext in entry["artifact_exts"]:
                  app = "soma"
                  # Asset names are versionless on purpose — the version is
                  # encoded in the release tag. That lets the docs site point
                  # at `releases/latest/download/<name>` and never go stale.
                  name = f"{app}-desktop-{os_name}-{arch}.{ext}"
                  artifacts.append(
                      {
                          "name": name,
                          "app": app,
                          "os": os_name,
                          "arch": arch,
                          "ext": ext,
                          "url": f"{tagged_base}/{name}",
                          "latest_url": f"{latest_base}/{name}",
                      }
                  )
          manifest = {
              "schema_version": "soma.release-manifest.v1",
              "release_type": "desktop",
              "version": version,
              "tag": tag,
              "repo": repo,
              "artifacts": artifacts,
          }
          with open("artifacts/desktop/manifest/desktop-release-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

      - name: Aggregate per-platform SHA256SUMS into a single manifest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          cd artifacts/desktop/manifest

          # Pull every per-platform SHA256SUMS-*.txt that the matrix legs
          # uploaded to this tag; each matrix leg's filename is disjoint
          # (suffixed by os-arch), so all of them coexist on the release.
          # Concatenate + sort to produce one consumer-facing SHA256SUMS.txt
          # that lists every artifact on the tag.
          gh release download "$TAG" --pattern 'SHA256SUMS-*.txt' --dir .
          : > SHA256SUMS.txt.tmp
          for f in SHA256SUMS-*.txt; do
            [ -f "$f" ] || continue
            cat "$f" >> SHA256SUMS.txt.tmp
          done
          sort -u -k2 SHA256SUMS.txt.tmp > SHA256SUMS.txt
          rm -f SHA256SUMS.txt.tmp
          echo "Aggregated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload manifest + aggregated SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/manifest/desktop-release-manifest.json
            artifacts/desktop/manifest/SHA256SUMS.txt
