name: Release desktop (Electron)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (defaults to desktop package.json version)
        required: false
        type: string
      tag:
        description: Git tag for the GitHub Release (defaults to desktop-v<version>)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub Release as prerelease
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Resolve version + tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./desktop/soma/package.json').version")"
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="desktop-v${VERSION}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release (never latest)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Desktop ${{ steps.meta.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          makeLatest: false
          draft: false
          body: |
            Soma desktop builds for Linux and macOS.

            Assets are suffixed with OS/arch.

  targets:
    name: Load build matrix
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.load.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: load
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP="$(jq -c '.desktop' .github/targets.json)"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"

  build:
    name: Build + publish (${{ matrix.os }} / ${{ matrix.arch }})
    needs: [prepare, targets]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # The @soma/node napi-rs addon is built by `pnpm --filter @soma/node run
      # build` during the desktop build, so cargo + rustc must be available.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # electron-builder reads APPLE_API_KEY as a *path* to the .p8 file (not
      # the key contents). The secret stores the raw -----BEGIN PRIVATE KEY-----
      # body so it round-trips safely through GitHub Actions; we write it to
      # a tempfile here and re-export APPLE_API_KEY to point at it.
      - name: Materialize Apple API key
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Electron apps (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_API_KEY is exported by the previous step (path to .p8).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm --filter soma run build:mac -- "${{ matrix.electron_arch_flag }}"

      - name: Build Electron apps (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter soma run build:linux -- "${{ matrix.electron_arch_flag }}"

      - name: Collect artifacts
        shell: bash
        env:
          EXTS_JSON: ${{ toJSON(matrix.artifact_exts) }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"

          # electron-builder emits one file per target in the `mac`/`linux`
          # config; we copy them all with a uniform `soma-desktop-<v>-<os>-<arch>.<ext>`
          # name so users can find the right asset regardless of how
          # electron-builder spells the source filename (`soma-X.Y.Z.dmg`,
          # `soma-X.Y.Z-mac.zip`, `soma_X.Y.Z_arm64.deb`, ...).
          while IFS= read -r ext; do
            [ -n "$ext" ] || continue
            SRC="$(find desktop/soma/dist -maxdepth 1 -name "*.${ext}" ! -name '*.blockmap' -print | head -n 1)"
            if [ -z "$SRC" ]; then
              echo "Missing *.${ext} in desktop/soma/dist (matrix: ${{ matrix.os }}/${{ matrix.arch }})" >&2
              exit 1
            fi
            DEST="$OUT_DIR/soma-desktop-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.${ext}"
            cp "$SRC" "$DEST"
            echo "Collected ${SRC} -> ${DEST}"
          done < <(printf '%s' "$EXTS_JSON" | jq -r '.[]')

      - name: Add per-platform SHA256SUMS and install scripts to release dir
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}"
          PARTIAL="SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt"

          # Compute the per-platform partial SHA256SUMS. publish-manifest job
          # downloads every partial and concatenates them into the consumer-
          # facing `SHA256SUMS.txt`, so this asset name has to be unique per
          # matrix leg (otherwise softprops/action-gh-release would overwrite
          # previous legs' manifests).
          sha_one() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          (
            cd "$OUT_DIR"
            : > "$PARTIAL.tmp"
            for f in *; do
              [ -f "$f" ] || continue
              case "$f" in
                SHA256SUMS*.txt|*.tmp) continue ;;
              esac
              sha_one "$f" >> "$PARTIAL.tmp"
            done
            sort -k2 "$PARTIAL.tmp" > "$PARTIAL"
            rm -f "$PARTIAL.tmp"
          )

          echo "Release dir contents:"
          ls -la "$OUT_DIR"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/soma-desktop-${{ needs.prepare.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.*
            artifacts/desktop/${{ matrix.os }}-${{ matrix.arch }}/SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

  publish-manifest:
    name: Publish release manifest
    needs: [prepare, targets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate desktop release manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          TARGETS_JSON: ${{ needs.targets.outputs.desktop }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          python3 <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # The matrix (os/arch/ext per entry) is the single source of truth
          # — propagated from .github/targets.json by the `targets` job.
          targets = json.loads(os.environ["TARGETS_JSON"])
          artifacts = []
          for entry in targets:
              os_name = entry["os"]
              arch = entry["arch"]
              for ext in entry["artifact_exts"]:
                  for app in ("soma",):
                      name = f"{app}-desktop-{version}-{os_name}-{arch}.{ext}"
                      artifacts.append(
                          {
                              "name": name,
                              "app": app,
                              "os": os_name,
                              "arch": arch,
                              "ext": ext,
                              "url": f"{base}/{name}",
                          }
                      )
          manifest = {
              "schema_version": "soma.release-manifest.v1",
              "release_type": "desktop",
              "version": version,
              "tag": tag,
              "repo": repo,
              "artifacts": artifacts,
          }
          with open("artifacts/desktop/manifest/desktop-release-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

      - name: Aggregate per-platform SHA256SUMS into a single manifest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop/manifest
          cd artifacts/desktop/manifest

          # Pull every per-platform SHA256SUMS-*.txt that the matrix legs
          # uploaded to this tag; each matrix leg's filename is disjoint
          # (suffixed by os-arch), so all of them coexist on the release.
          # Concatenate + sort to produce one consumer-facing SHA256SUMS.txt
          # that lists every artifact on the tag.
          gh release download "$TAG" --pattern 'SHA256SUMS-*.txt' --dir .
          : > SHA256SUMS.txt.tmp
          for f in SHA256SUMS-*.txt; do
            [ -f "$f" ] || continue
            cat "$f" >> SHA256SUMS.txt.tmp
          done
          sort -u -k2 SHA256SUMS.txt.tmp > SHA256SUMS.txt
          rm -f SHA256SUMS.txt.tmp
          echo "Aggregated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload manifest + aggregated SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/desktop/manifest/desktop-release-manifest.json
            artifacts/desktop/manifest/SHA256SUMS.txt
