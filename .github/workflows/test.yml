name: Test (unit + coverage + UI E2E)

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Build + test the whole Rust workspace — the Tauri desktop crates
    # (desktop-*) plus the shared backend crates and the `somad` server
    # binary. `--workspace` catches binaries + every test crate in one
    # pass so downstream consumers can't drift silently (e.g. a signature
    # change in `soma-membership` once broke the bot HTTP routes on #85).
    name: Rust workspace (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      # Tauri 2 brings in wry → webkit2gtk → soup; these libs aren't on the
      # default ubuntu-latest image. See https://tauri.app/start/prerequisites/
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # `cargo test` above runs `desktop-app`'s `emit_typescript_bindings`
      # test as a side effect, which regenerates
      # desktop/desktop-sdk/src/bindings/index.ts from the live Rust command
      # graph (see desktop/desktop-app/src-tauri/src/bindings.rs). This step
      # is what actually makes good on that file's own doc comment ("CI then
      # asserts the working tree stays clean") — a drifted DTO/command
      # surface fails the build instead of silently shipping a stale SDK.
      - name: Verify specta bindings are up to date
        run: |
          if ! git diff --exit-code -- desktop/desktop-sdk/src/bindings/; then
            echo "::error::Generated TypeScript bindings are stale. Run \`cargo test -p desktop-app emit_typescript_bindings\` and commit the result." >&2
            exit 1
          fi

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Run @soma/ui vitest with coverage
        run: pnpm --filter @soma/ui run test:coverage

      - name: Upload @soma/ui coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-soma-ui
          path: desktop/desktop-ui/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run @soma/editor vitest with coverage
        run: pnpm --filter @soma/editor run test:coverage

      - name: Upload @soma/editor coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-soma-editor
          path: desktop/desktop-editor/coverage
          if-no-files-found: ignore
          retention-days: 14

      # No test:coverage script here (unlike @soma/ui / @soma/editor) — @soma/sdk
      # doesn't have a coverage config, so this is a plain pass/fail gate.
      - name: Run @soma/sdk vitest
        run: pnpm --filter @soma/sdk run test

  ui:
    # @soma/ui (desktop/desktop-ui) is the largest package in the repo, but
    # no workflow ever typechecked or linted it — only its vitest coverage
    # (job `unit`, above) and the Storybook build (job `e2e`, below) ran in
    # CI. That gap is exactly how ~20 biome errors accumulated unnoticed.
    # This job closes it, mirroring the `renderer` job below for
    # @soma/desktop-app.
    name: "@soma/ui (typecheck + lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @soma/ui run typecheck

      - name: Lint
        run: pnpm --filter @soma/ui run lint:ci

  e2e:
    name: UI E2E (Cucumber × Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build Storybook (the same artifact we publish to gh-pages/storybook)
        run: pnpm --filter @soma/ui run build:storybook -- --output-dir storybook-static

      - name: Install Playwright browsers
        run: pnpm --filter @soma/e2e exec playwright install --with-deps chromium

      - name: Serve Storybook + run BDD features
        env:
          E2E_BASE_URL: http://127.0.0.1:6006
        run: |
          npx --yes http-server desktop/desktop-ui/storybook-static -p 6006 -s &
          SERVER_PID=$!
          npx --yes wait-on http://127.0.0.1:6006
          pnpm --filter @soma/e2e run test
          kill $SERVER_PID || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: desktop/desktop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    # The desktop app's own TS (React/Vite renderer under
    # desktop/desktop-app/src/) was never typechecked, linted, or built by
    # any workflow — it was only ever compiled as a side effect of the
    # manual, workflow_dispatch-only release-desktop.yml. This job closes
    # that gap on every push/PR.
    name: Desktop app renderer (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @soma/desktop-app run typecheck

      - name: Lint
        run: pnpm --filter @soma/desktop-app run lint:ci

      - name: Build
        run: pnpm --filter @soma/desktop-app run build

  cargo-deny:
    # Rust supply-chain gate: RustSec advisories, license policy, banned/
    # duplicate crates, and untrusted sources. Policy lives in the root
    # `deny.toml`. `arguments: ""` overrides the action's own default
    # (`--all-features`) so this matches how the rest of CI actually builds
    # (no workflow anywhere passes `--all-features`) and what `deny.toml`'s
    # own `[graph] all-features = false` is written against.
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: ""
