name: Test (unit + coverage + UI E2E)

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Build + test the whole Rust workspace, not just the crates that
    # land in the napi addon. `pnpm typecheck:node` only walks the
    # soma-node dependency graph (daemon, peer, storage, …), so
    # downstream consumers like `somad` were drifting silently — a
    # signature change in `soma-membership` broke the bot HTTP routes
    # on #85 and the workflow never noticed. `--workspace` catches
    # binaries + every test crate in one pass.
    name: Rust workspace (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Run @soma/ui vitest with coverage
        run: pnpm --filter @soma/ui run test:coverage

      - name: Upload @soma/ui coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-soma-ui
          path: desktop/desktop-ui/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run @soma/editor vitest with coverage
        run: pnpm --filter @soma/editor run test:coverage

      - name: Upload @soma/editor coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-soma-editor
          path: desktop/desktop-editor/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run soma renderer vitest with coverage
        run: pnpm --filter soma run test:coverage

      - name: Upload soma coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-soma
          path: desktop/soma/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: UI E2E (Cucumber × Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build Storybook (the same artifact we publish to gh-pages/storybook)
        run: pnpm --filter @soma/ui run build:storybook -- --output-dir storybook-static

      - name: Install Playwright browsers
        run: pnpm --filter @soma/e2e exec playwright install --with-deps chromium

      - name: Serve Storybook + run BDD features
        env:
          E2E_BASE_URL: http://127.0.0.1:6006
        run: |
          npx --yes http-server desktop/desktop-ui/storybook-static -p 6006 -s &
          SERVER_PID=$!
          npx --yes wait-on http://127.0.0.1:6006
          pnpm --filter @soma/e2e run test
          kill $SERVER_PID || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/desktop-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
