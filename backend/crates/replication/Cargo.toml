[package]
name = "soma-replication"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "soma_replication"
path = "src/lib.rs"

[dependencies]
soma-peer = { workspace = true }
soma-storage = { workspace = true }
soma-membership = { workspace = true }
soma-proto-build = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
libp2p = { workspace = true }
prost = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
soma-common = { workspace = true }
prost-types = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "migrate", "runtime-tokio-rustls"] }
