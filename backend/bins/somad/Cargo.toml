[package]
name = "somad"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Soma's unified server binary — subcommands for bot, relay, rendezvous, bff, and composed-mode (all)"

[[bin]]
name = "somad"
path = "src/main.rs"

[dependencies]
# Shared crates (the union of what the former *d binaries linked).
soma-core = { workspace = true, features = ["db"] }
soma-storage = { workspace = true }
soma-net = { workspace = true }
soma-common = { workspace = true }
soma-vdfs = { workspace = true }
soma-metrics = { workspace = true }
soma-peer = { workspace = true }
soma-proto-build = { workspace = true }
soma-membership = { workspace = true }
soma-rendezvous = { workspace = true }
soma-relay = { workspace = true }
soma-bff = { workspace = true }

# Top-level + per-subcommand deps.
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
libp2p = { workspace = true }
futures = { workspace = true }
prometheus-client = { workspace = true }
prometheus-client-derive-encode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, features = ["any", "postgres", "sqlite", "migrate", "runtime-tokio-rustls"] }
sha2 = { workspace = true }
toml = { workspace = true }
once_cell = "1"
