services:
  soma-relay:
    image: ${SOMA_IMAGE:-ghcr.io/stephane-segning/somad}:${SOMA_TAG:-latest}
    pull_policy: always
    # `somad` dispatches on a mandatory subcommand (backend/bins/somad/src/commands/mod.rs) —
    # there is no bare/default mode, so every service here selects one explicitly.
    command: ["relay"]
    environment:
      RUST_LOG: info
      HTTP_ADDR: 0.0.0.0:8081
      SOMA_DATA_DIR: /data
    ports:
      - "8081:8081"
      - "14003:14003/tcp"
      - "14103:14103/tcp"
      - "14203:14203/udp"
    volumes:
      - relay-data:/data

  soma-rendezvous:
    image: ${SOMA_IMAGE:-ghcr.io/stephane-segning/somad}:${SOMA_TAG:-latest}
    pull_policy: always
    command: ["rendezvous"]
    environment:
      RUST_LOG: info
      HTTP_ADDR: 0.0.0.0:8082
      SOMA_DATA_DIR: /data
    ports:
      - "8082:8082"
      - "14004:14004/tcp"
      - "14104:14104/tcp"
      - "4204:4204/udp"
    volumes:
      - rendezvous-data:/data

volumes:
  relay-data: {}
  rendezvous-data: {}
