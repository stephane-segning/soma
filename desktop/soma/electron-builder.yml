appId: digital.camer.sschool.soma
productName: soma
protocols:
  - name: Soma Deep Link
    schemes:
      - soma
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{biome.jsonc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@soma/desktop-config/src/**'
  - '!node_modules/@soma/desktop-config/tsconfig.json'
  - '!node_modules/@soma/desktop-db/src/**'
  - '!node_modules/@soma/desktop-db/tsconfig.json'
asarUnpack:
  - resources/**
  # The napi-rs addon must live outside the asar so Node can `dlopen()` it.
  - node_modules/@soma/node/**/*.node
  - node_modules/@soma/node/index.js
  - node_modules/@soma/node/index.d.ts
  - node_modules/@soma/node/package.json
win:
  executableName: soma
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization stays disabled in the checked-in config so unsigned dev
  # builds work out of the box. To enable for a real release, set these env
  # vars in CI and flip this to `notarize: { teamId: <your-team> }`:
  #   CSC_LINK             — base64-encoded Developer ID Application .p12
  #   CSC_KEY_PASSWORD     — password for the .p12
  #   APPLE_API_KEY        — path to the App Store Connect .p8 key file
  #   APPLE_API_KEY_ID     — the key id (e.g. ABCD12EFGH)
  #   APPLE_API_ISSUER     — issuer UUID from App Store Connect
  # release-desktop.yml currently does an ad-hoc codesign + ditto rezip; keep
  # that fallback in place until the proper Developer ID flow lands (P6b).
  notarize: false
linux:
  target:
    - AppImage
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://soma.ssegning.com/auto-updates
