appId: digital.camer.sschool.soma
productName: soma
protocols:
  - name: Soma Deep Link
    schemes:
      - soma
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{biome.jsonc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@soma/desktop-config/src/**'
  - '!node_modules/@soma/desktop-config/tsconfig.json'
  - '!node_modules/@soma/desktop-db/src/**'
  - '!node_modules/@soma/desktop-db/tsconfig.json'
asarUnpack:
  - resources/**
  # The napi-rs addon must live outside the asar so Node can `dlopen()` it.
  - node_modules/@soma/node/**/*.node
  - node_modules/@soma/node/index.js
  - node_modules/@soma/node/index.d.ts
  - node_modules/@soma/node/package.json
win:
  executableName: soma
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization is enabled. release-desktop.yml provides the required env
  # vars (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID,
  # APPLE_API_ISSUER, APPLE_TEAM_ID) when running in CI. Local dev builds
  # without those secrets fall back to electron-builder's auto-discovery; if
  # no Developer ID cert is present, signing is skipped and notarization is
  # a no-op.
  notarize: true
linux:
  target:
    - AppImage
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://soma.ssegning.com/auto-updates
