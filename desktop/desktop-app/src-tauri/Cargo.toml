[package]
name = "desktop-app"
description = "Soma Tauri V2 desktop binary (thin shell — wires plugins, state, and commands from the desktop-* crates)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# WebView inspector. Enable for `cargo run --features devtools` or via
# `tauri dev`; release bundles must omit this so the inspector + its
# private-API entry points on macOS don't ship to end users.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
desktop-core = { workspace = true }
desktop-services = { workspace = true }
desktop-daemon = { workspace = true }
desktop-agent = { workspace = true }
# Needed directly (not just transitively through desktop-commands) for
# `desktop_api::agent_config_store::DaemonBackedAgentConfigStore`, which
# this binary's `setup` hook wires into the agent's `DbConfigSource`.
desktop-api = { workspace = true }
desktop-commands = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

tauri = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-store = { workspace = true }
# Supported on mobile (Android + iOS) as well as desktop, so it stays
# unconditional. The dynamic `.register(scheme)` call is desktop-only (see
# `startup/deep_link.rs`); on mobile the scheme is declared statically via
# `plugins.deep-link.mobile` in `tauri.conf.json`, which the plugin's own
# build script writes into Info.plist / AndroidManifest.xml.
tauri-plugin-deep-link = { workspace = true }

# Desktop-only: no Android/iOS support in the plugin itself (process/updater/
# window-state) or not meaningful there (single-instance — mobile OSes are
# already single-instance by construction).
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-process = { workspace = true }
tauri-plugin-single-instance = { workspace = true, features = ["deep-link"] }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
