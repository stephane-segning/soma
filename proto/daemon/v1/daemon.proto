syntax = "proto3";

package daemon.v1;

import "google/protobuf/empty.proto";
import "spaceroom/v1/membership.proto";

// Status for the local daemon (IPC over Unix domain socket).
message StatusRequest {}

message StatusResponse {
  string peer_id = 1;
  repeated string listen_addrs = 2;
}

message JoinSpaceRequest {
  // Target space the user wants to join.
  string space_id = 1;

  // Human-friendly metadata for reviewers/bots.
  string display_name = 2;
  string device_name = 3;

  // Target onboarding peer (bot/admin) to send the join request to.
  string target_peer_id = 4;

  // Multiaddrs to dial for that onboarding peer (bootstrap/relay aware).
  repeated string target_multiaddrs = 5;
}

message JoinSpaceResponse {
  string request_id = 1;
}

message RevokeSpaceRequest {
  string space_id = 1;
  string subject_peer_id = 2;
  string reason = 3;
}

message RevokeSpaceResponse {
  bool accepted = 1;
}

message ListSpaceMembersRequest {
  string space_id = 1;
}

message SpaceMember {
  string peer_id = 1;
  string role = 2;
  int64 expires_at = 3;
  string space_id = 4;
}

message ListSpaceMembersResponse {
  repeated SpaceMember members = 1;
}

message ListMyMembershipsResponse {
  repeated SpaceMember memberships = 1;
}

message IssueIssuerCapabilityRequest {
  string space_id = 1;
  string target_peer_id = 2;
  int64 expires_at = 3;
}

message IssueIssuerCapabilityResponse {
  bool accepted = 1;
}

message DiscoverSpacesRequest {}

message DiscoveredSpace {
  string space_id = 1;
  string display_name = 2;
  repeated string tags = 3;
}

message DiscoverSpacesResponse {
  repeated DiscoveredSpace spaces = 1;
}

message Space {
  string space_id = 1;
  string display_name = 2;
  string owner_peer_id = 3;
  int64 created_at = 4;
}

message ListSpacesRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  optional string q = 3;
}

message ListSpacesResponse {
  repeated Space spaces = 1;
  uint32 limit = 2;
  uint32 offset = 3;
  optional uint32 next_offset = 4;
}

message CreateSpaceRequest {
  string space_id = 1;
  string display_name = 2;
}

message CreateSpaceResponse {
  string space_id = 1;
  string owner_peer_id = 2;
}

message GetSpaceRequest {
  string space_id = 1;
}

message GetSpaceResponse {
  Space space = 1;
}

message UpdateSpaceRequest {
  string space_id = 1;
  string display_name = 2;
}

message UpdateSpaceResponse {
  Space space = 1;
}

message DeleteSpaceRequest {
  string space_id = 1;
}

message DeleteSpaceResponse {
  bool deleted = 1;
}

message JoinRequest {
  string request_id = 1;
  string space_id = 2;
  string subject_peer_id = 3;
  string display_name = 4;
  string device_name = 5;
  int32 requested_role = 6;
  int64 created_at = 7;
}

message ListJoinRequestsRequest {}

message ListJoinRequestsResponse {
  repeated JoinRequest requests = 1;
}

message DecideJoinRequest {
  string request_id = 1;
  bool approve = 2;
  string role = 3;
  string reason = 4;
}

message DecideJoinResponse {
  spaceroom.v1.JoinDecision decision = 1;
}

message StreamEventsRequest {}

message JoinDecisionEvent {
  string from_peer_id = 1;
  spaceroom.v1.JoinDecision decision = 2;
}

message JoinSubmitEvent {
  string request_id = 1;
  string target_peer_id = 2;
}

message JoinFailedEvent {
  string target_peer_id = 1;
  string error = 2;
}

message YooptaBlobAddedEvent {
  string space_id = 1;
  string doc_id = 2;
  string cid = 3;
  string mime = 4;
  uint64 size = 5;
  string name = 6;
}

message UploadBlobRequest {
  string space_id = 1;
  bytes data = 2;
  string mime = 3;
  string name = 4;
  // Optional: associate the blob with a Yoopta document so listeners can react.
  string doc_id = 5;
}

message UploadBlobResponse {
  string cid = 1;
  uint64 size = 2;
  string mime = 3;
  string name = 4;
}

message ReadBlobRequest {
  string space_id = 1;
  string cid = 2;
}

message ReadBlobResponse {
  bytes data = 1;
  uint64 size = 2;
  string mime = 3;
}

message UpsertDocumentRequest {
  string space_id = 1;
  string document_id = 2;
  string content_json = 3;
  bool published = 4;
  int64 updated_at_ms = 5;
}

message UpsertDocumentResponse {
  bool ok = 1;
}

message GetDocumentRequest {
  string space_id = 1;
  string document_id = 2;
}

message GetDocumentResponse {
  string space_id = 1;
  string document_id = 2;
  string content_json = 3;
  bool published = 4;
  int64 updated_at_ms = 5;
}

message PageRecord {
  string space_id = 1;
  string page_id = 2;
  string title = 3;
  repeated string parent_page_ids = 4;
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
}

message EnsurePageRequest {
  string space_id = 1;
  string page_id = 2;
  string title = 3;
  repeated string parent_page_ids = 4;
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
}

message EnsurePageResponse {
  PageRecord page = 1;
}

message ListPagesRequest {
  string space_id = 1;
}

message ListPagesResponse {
  repeated PageRecord pages = 1;
}

message UpdatePageTitleRequest {
  string space_id = 1;
  string page_id = 2;
  string title = 3;
}

message UpdatePageTitleResponse {
  PageRecord page = 1;
}

message SetPageParentsRequest {
  string space_id = 1;
  string page_id = 2;
  repeated string parent_page_ids = 3;
}

message SetPageParentsResponse {
  PageRecord page = 1;
}

message DaemonEvent {
  oneof event {
    JoinDecisionEvent join_decision = 1;
    JoinSubmitEvent join_submitted = 2;
    JoinFailedEvent join_failed = 3;
    YooptaBlobAddedEvent yoopta_blob_added = 4;
  }
}

// The Daemon service defines the gRPC API for the local Soma daemon process,
// used by clients to interact with the peer over a Unix domain socket.
service Daemon {
  // Get the status of the local daemon.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Request to join a space.
  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse);
  // Stream events from the daemon.
  rpc StreamEvents(StreamEventsRequest) returns (stream DaemonEvent);
  // Revoke a member's access to a space.
  rpc RevokeSpace(RevokeSpaceRequest) returns (RevokeSpaceResponse);
  // List members of a given space.
  rpc ListSpaceMembers(ListSpaceMembersRequest) returns (ListSpaceMembersResponse);
  // List all spaces the current user is a member of.
  rpc ListMyMemberships(google.protobuf.Empty) returns (ListMyMembershipsResponse);
  // Issue a capability for another peer to act as an issuer for a space.
  rpc IssueIssuerCapability(IssueIssuerCapabilityRequest) returns (IssueIssuerCapabilityResponse);
  // Discover available spaces.
  rpc DiscoverSpaces(DiscoverSpacesRequest) returns (DiscoverSpacesResponse);
  // List spaces managed by this daemon.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  // Create a new space.
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  // Get details for a specific space.
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);
  // Update a space's details.
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  // Delete a space.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  // List pending join requests.
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
  // Approve or reject a join request.
  rpc DecideJoin(DecideJoinRequest) returns (DecideJoinResponse);
  // Upload a blob to the daemon's blob store.
  rpc UploadBlob(UploadBlobRequest) returns (UploadBlobResponse);
  // Read a blob from the daemon's blob store by its content ID.
  rpc ReadBlob(ReadBlobRequest) returns (ReadBlobResponse);
  // Create or update a document.
  rpc UpsertDocument(UpsertDocumentRequest) returns (UpsertDocumentResponse);
  // Get a document's content.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  // Create a page record if it does not exist.
  rpc EnsurePage(EnsurePageRequest) returns (EnsurePageResponse);
  // List pages for a space.
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  // Update a page's title.
  rpc UpdatePageTitle(UpdatePageTitleRequest) returns (UpdatePageTitleResponse);
  // Set a page's parent IDs.
  rpc SetPageParents(SetPageParentsRequest) returns (SetPageParentsResponse);
}
