syntax = "proto3";

package agent.v1;

import "google/protobuf/empty.proto";

// Local agent service (IPC over Unix domain socket).
service Agent {
  rpc Status(google.protobuf.Empty) returns (StatusResponse);
  rpc ListModels(google.protobuf.Empty) returns (ListModelsResponse);
  rpc InlineComplete(InlineCompleteRequest) returns (InlineCompleteResponse);
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatRequest) returns (stream ChatStreamEvent);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc Rerank(RerankRequest) returns (RerankResponse);
  rpc ResolveDrift(ResolveDriftRequest) returns (ResolveDriftResponse);
  rpc EnqueueBackgroundTask(EnqueueBackgroundTaskRequest) returns (EnqueueBackgroundTaskResponse);
  rpc ListBackgroundTasks(ListBackgroundTasksRequest) returns (ListBackgroundTasksResponse);
}

message StatusResponse {
  string version = 1;
  string default_chat_model = 2;
  string default_embed_model = 3;
  repeated ModelInfo models = 4;
}

enum ModelKind {
  MODEL_KIND_UNSPECIFIED = 0;
  MODEL_KIND_CHAT = 1;
  MODEL_KIND_EMBED = 2;
}

message ModelInfo {
  string name = 1;
  ModelKind kind = 2;
  string path = 3;
  bool loaded = 4;
  uint64 size_bytes = 5;
}

message InlineCompleteRequest {
  string prompt = 1;
  string context = 2;
  // Optional model override; defaults to StatusResponse.default_chat_model.
  string model = 3;
}

message InlineCompleteResponse {
  string completion = 1;
  string model = 2;
}

message ChatMessage {
  // Typical roles: "system", "user", "assistant".
  string role = 1;
  string content = 2;
}

message ChatRequest {
  // Optional model override; defaults to StatusResponse.default_chat_model.
  string model = 1;
  repeated ChatMessage messages = 2;
  float temperature = 3;
  uint64 max_tokens = 4;
}

message ChatResponse {
  string model = 1;
  string content = 2;
}

message ChatStreamEvent {
  oneof event {
    string token = 1;
    ChatResponse done = 2;
  }
}

message EmbedRequest {
  // Optional model override; defaults to StatusResponse.default_embed_model.
  string model = 1;
  repeated string input = 2;
}

message EmbedVector {
  repeated float values = 1;
}

message EmbedResponse {
  string model = 1;
  repeated EmbedVector embeddings = 2;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message RerankRequest {
  string query = 1;
  repeated RerankCandidate candidates = 2;
  // Optional model override; defaults to StatusResponse.default_embed_model.
  string model = 3;
  // Optional cap; defaults to all candidates.
  uint32 top_n = 4;
}

message RerankCandidate {
  string id = 1;
  string content = 2;
}

message RerankResult {
  string id = 1;
  double score = 2;
  uint32 rank = 3;
}

message RerankResponse {
  string model = 1;
  repeated RerankResult results = 2;
}

message ResolveDriftRequest {
  bytes left_update = 1;
  bytes right_update = 2;
}

message ResolveDriftResponse {
  bytes merged_update = 1;
}

enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_EXPLAIN_SELECTION = 1;
  BACKGROUND_TASK_KIND_EXPAND_SELECTION = 2;
  BACKGROUND_TASK_KIND_RESEARCH_SELECTION = 3;
}

enum BackgroundTaskStatus {
  BACKGROUND_TASK_STATUS_UNSPECIFIED = 0;
  BACKGROUND_TASK_STATUS_QUEUED = 1;
  BACKGROUND_TASK_STATUS_RUNNING = 2;
  BACKGROUND_TASK_STATUS_SUCCEEDED = 3;
  BACKGROUND_TASK_STATUS_FAILED = 4;
}

message BackgroundTask {
  string task_id = 1;
  BackgroundTaskKind kind = 2;
  BackgroundTaskStatus status = 3;
  string space_id = 4;
  string document_id = 5;
  string selection_text = 6;
  bool persist_in_document = 7;
  string result_text = 8;
  string error = 9;
  uint64 created_at_ms = 10;
  uint64 updated_at_ms = 11;
}

message EnqueueBackgroundTaskRequest {
  BackgroundTaskKind kind = 1;
  string space_id = 2;
  string document_id = 3;
  string selection_text = 4;
  string model = 5;
  bool persist_in_document = 6;
}

message EnqueueBackgroundTaskResponse {
  BackgroundTask task = 1;
}

message ListBackgroundTasksRequest {
  string space_id = 1;
  uint32 limit = 2;
}

message ListBackgroundTasksResponse {
  repeated BackgroundTask tasks = 1;
}
