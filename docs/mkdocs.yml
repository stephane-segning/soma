site_name: Soma
repo_url: https://github.com/stephane-segning/soma
edit_uri: edit/main/docs/src/
docs_dir: src
theme:
  name: bootstrap386

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Overview: 00-overview.md
  - Glossary: 01-glossary.md
  - Getting Started: getting-started/index.md
  - Architecture:
      - Platform Components: architecture/soma-tapia.md
      - End-to-End Flows: architecture/e2e-flows.md
      - libp2p Primer: architecture/libp2p-primer.md
      - Peer Connectivity: architecture/peer-connectivity.md
      - Infrastructure Services: architecture/infra-services.md
      - Class Membership: architecture/class-membership.md
      - Blobs (VDF): architecture/blobs-vdfs.md
      - Packaging & Deployment: architecture/deployment.md
      - ADRs:
          - ADR-0001: architecture/adrs/0001-local-daemon-grpc.md
          - ADR-0002: architecture/adrs/0002-capabilities-membership.md
          - ADR-0003: architecture/adrs/0003-bots-as-cache.md
          - ADR-0004: architecture/adrs/0004-vdfs-crate.md
      - arc42:
          - 01 Introduction & Goals: architecture/arc42/01-introduction-goals.md
          - 02 Constraints: architecture/arc42/02-constraints.md
          - 03 Context & Scope: architecture/arc42/03-context.md
          - 04 Solution Strategy: architecture/arc42/04-solution-strategy.md
          - 05 Building Block View: architecture/arc42/05-building-block-view.md
          - 06 Runtime View: architecture/arc42/06-runtime-view.md
          - 07 Deployment View: architecture/arc42/07-deployment-view.md
          - 08 Crosscutting Concepts: architecture/arc42/08-crosscutting.md
          - 09 Architecture Decisions: architecture/arc42/09-architecture-decisions.md
          - 10 Quality Requirements: architecture/arc42/10-quality-requirements.md
          - 11 Risks & Technical Debt: architecture/arc42/11-risks-tech-debt.md
          - 12 Glossary: architecture/arc42/12-glossary.md
  - Development:
      - Dependencies: development/dependencies.md
      - Protos & Codegen: development/protos.md
      - Database & Migrations: development/database.md
      - justfile: development/justfile.md
      - Peer Events: development/peer-events.md
      - Tauri Apps (commands): development/tauri-commands.md
      - Agentd IPC: development/agentd-ipc.md
      - Local LLMs (agentd models): development/agentd-models.md
      - Daemon Testing (grpcurl): development/daemon-grpcurl.md
      - Backend Refactor Notes: development/backend-refactor-notes.md
  - Security:
      - Threat Model: security/threat-model.md
      - SBOM: security/sbom.md
